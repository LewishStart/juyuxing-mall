<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林元元 · 图标升级预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #FAF6F0; color: #2A2622; padding: 40px 20px; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 600; color: #2D4A3E; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #8B8278; margin-bottom: 32px; }
  .section { margin-bottom: 32px; }
  .section-title { font-size: 16px; font-weight: 600; color: #5C544B; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #E5DDD0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; }
  .card { background: #FDFBF8; border-radius: 12px; padding: 16px 8px; text-align: center; border: 1px solid #EFE7D8; }
  .card img { width: 36px; height: 36px; margin-bottom: 8px; }
  .card .name { font-size: 11px; color: #8B8278; }
  .tab-bar-demo { display: flex; justify-content: space-around; background: #FDF8F3; border-radius: 16px; padding: 12px 0; margin-top: 16px; border: 1px solid #E5DDD0; }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tab-item img { width: 28px; height: 28px; }
  .tab-item span { font-size: 11px; }
  .tab-item.inactive img { opacity: 1; }
  .tab-item.inactive span { color: #8B7E72; }
  .tab-item.active span { color: #E8A87C; font-weight: 600; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
  .badge-new { background: #E8A87C; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <h1>林元元 · 图标升级预览</h1>
  <p class="subtitle">Lucide/Feather 线条风格 · 1.5px 描边 · 圆角端点 · 96×96 高清 PNG</p>

  <div class="section">
    <div class="section-title">Tab Bar 图标（普通 / 选中）</div>
    <div class="tab-bar-demo">
      <div class="tab-item inactive"><img src="./miniprogram/images/icons/home.png"><span>首页</span></div>
      <div class="tab-item active"><img src="./miniprogram/images/icons/home-active.png"><span>首页</span></div>
      <div class="tab-item inactive"><img src="./miniprogram/images/icons/category.png"><span>分类</span></div>
      <div class="tab-item active"><img src="./miniprogram/images/icons/category-active.png"><span>分类</span></div>
      <div class="tab-item inactive"><img src="./miniprogram/images/icons/cart.png"><span>购物车</span></div>
      <div class="tab-item active"><img src="./miniprogram/images/icons/cart-active.png"><span>购物车</span></div>
      <div class="tab-item inactive"><img src="./miniprogram/images/icons/user.png"><span>我的</span></div>
      <div class="tab-item active"><img src="./miniprogram/images/icons/user-active.png"><span>我的</span></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">功能图标</div>
    <div class="grid">
      <div class="card"><img src="./miniprogram/images/icons/search.png"><div class="name">search</div></div>
      <div class="card"><img src="./miniprogram/images/icons/heart.png"><div class="name">heart</div></div>
      <div class="card"><img src="./miniprogram/images/icons/star.png"><div class="name">star</div></div>
      <div class="card"><img src="./miniprogram/images/icons/edit.png"><div class="name">edit</div></div>
      <div class="card"><img src="./miniprogram/images/icons/settings.png"><div class="name">settings</div></div>
      <div class="card"><img src="./miniprogram/images/icons/clock.png"><div class="name">clock</div></div>
      <div class="card"><img src="./miniprogram/images/icons/chat.png"><div class="name">chat</div></div>
      <div class="card"><img src="./miniprogram/images/icons/location.png"><div class="name">location</div></div>
      <div class="card"><img src="./miniprogram/images/icons/money.png"><div class="name">money</div></div>
      <div class="card"><img src="./miniprogram/images/icons/truck.png"><div class="name">truck</div></div>
      <div class="card"><img src="./miniprogram/images/icons/package.png"><div class="name">package</div></div>
      <div class="card"><img src="./miniprogram/images/icons/shop.png"><div class="name">shop</div></div>
      <div class="card"><img src="./miniprogram/images/icons/gift.png"><div class="name">gift</div></div>
      <div class="card"><img src="./miniprogram/images/icons/list.png"><div class="name">list</div></div>
      <div class="card"><img src="./miniprogram/images/icons/image.png"><div class="name">image</div></div>
      <div class="card"><img src="./miniprogram/images/icons/return.png"><div class="name">return</div></div>
      <div class="card"><img src="./miniprogram/images/icons/book.png"><div class="name">book</div></div>
      <div class="card"><img src="./miniprogram/images/icons/people.png"><div class="name">people</div></div>
      <div class="card"><img src="./miniprogram/images/icons/agent.png"><div class="name">agent</div></div>
      <div class="card"><img src="./miniprogram/images/icons/handshake.png"><div class="name">handshake</div></div>
      <div class="card"><img src="./miniprogram/images/icons/hands.png"><div class="name">hands</div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">品牌图标</div>
    <div class="grid">
      <div class="card"><img src="./miniprogram/images/icons/leaf.png"><div class="name">leaf</div></div>
      <div class="card"><img src="./miniprogram/images/icons/yinyang.png"><div class="name">yinyang</div></div>
    </div>
  </div>
</div>
</body>
</html>
