<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>商品详情 — 林元元</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background:linear-gradient(180deg,#FDF8F3 0%,#FFFBF7 50%,#FDF8F3 100%);
  color:#4A3F35; font-size:14px; -webkit-font-smoothing:antialiased;
  max-width:430px; margin:0 auto; min-height:100vh; padding-bottom:100px;
}
.top-bar { display:flex; align-items:center; padding:8px 16px; gap:12px; }
.back { font-size:20px; color:#4A3F35; cursor:pointer; }
.top-bar .spacer { flex:1; }
.top-bar .more { font-size:18px; color:#8B7E72; }

/* ── Hero image ── */
.p-hero { width:100%; aspect-ratio:1/1; position:relative; overflow:hidden; }
.p-hero-img { width:100%; height:100%; background:linear-gradient(135deg,rgba(245,214,184,.35),#FFFBF7); display:flex; align-items:center; justify-content:center; font-size:100px; }
.p-hero .pager { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; }
.pager-dot { width:6px; height:6px; border-radius:50%; background:rgba(74,63,53,.2); }
.pager-dot.active { background:#E8A87C; width:16px; border-radius:3px; }

/* ── Info card ── */
.info-card { margin:16px; padding:20px; background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(74,63,53,.06); }
.info-title { font-size:22px; font-weight:700; line-height:1.3; }
.info-sub { font-size:12px; color:#8B7E72; margin-top:4px; }
.price-row { display:flex; align-items:baseline; gap:8px; margin-top:16px; }
.price { font-size:36px; font-weight:800; color:#E0725A; }
.price .yen { font-size:16px; }
.price-old { font-size:12px; color:#B0A59A; text-decoration:line-through; }
.price-saved { font-size:11px; background:rgba(224,114,90,.08); color:#E0725A; padding:2px 8px; border-radius:4px; margin-left:4px; }
.tags-row { display:flex; gap:6px; margin-top:14px; flex-wrap:wrap; }
.ttag { font-size:11px; padding:4px 12px; border-radius:999px; }
.ttag.green { background:rgba(139,168,136,.10); color:#6B8668; border:1px solid rgba(139,168,136,.20); }
.ttag.warm { background:rgba(232,168,124,.08); color:#C07A4A; border:1px solid rgba(232,168,124,.20); }

/* ── Specs ── */
.spec-card { margin:0 16px 12px; padding:16px 20px; background:#fff; border-radius:16px; box-shadow:0 2px 8px rgba(74,63,53,.04); }
.spec-card h3 { font-size:15px; font-weight:600; margin-bottom:12px; }
.spec-options { display:flex; gap:8px; flex-wrap:wrap; }
.spec-opt { padding:10px 20px; border-radius:999px; border:1.5px solid #E8E0D8; font-size:13px; color:#4A3F35; background:#FDF8F3; cursor:pointer; }
.spec-opt.active { border-color:#E8A87C; background:rgba(232,168,124,.06); color:#C07A4A; font-weight:500; }

/* ── Description ── */
.desc-card { margin:0 16px 12px; padding:20px; background:#fff; border-radius:16px; box-shadow:0 2px 8px rgba(74,63,53,.04); }
.desc-card h3 { font-size:15px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.desc-card h3 .leaf { color:#8BA888; }
.desc-text { font-size:13px; color:#8B7E72; line-height:1.9; }

/* ── Bottom bar ── */
.bottom-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:430px; max-width:100%; background:rgba(253,248,243,.96); backdrop-filter:blur(12px); border-top:1px solid #E8E0D8; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0)); display:flex; gap:12px; align-items:center; }
.cart-icon { width:42px; height:42px; border-radius:50%; border:1.5px solid #E8E0D8; background:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; position:relative; }
.cart-badge { position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; border-radius:8px; background:#E0725A; color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
.btn-add { flex:1; height:46px; border-radius:999px; background:linear-gradient(135deg,#E8A87C,#F5D6B8); color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; box-shadow:0 4px 14px rgba(232,168,124,.25); }
.btn-buy { flex:1; height:46px; border-radius:999px; background:linear-gradient(135deg,#4A3F35,#6B5E52); color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="back">‹</div>
  <div style="font-size:11px;color:#B0A59A">商品详情</div>
  <div class="spacer"></div>
  <div class="more">⋯</div>
</div>

<div class="p-hero">
  <div class="p-hero-img">🍵</div>
  <div class="pager"><span class="pager-dot active"></span><span class="pager-dot"></span><span class="pager-dot"></span></div>
</div>

<div class="info-card">
  <div class="info-title">菊花枸杞清肝茶</div>
  <div class="info-sub">清肝明目 · 降火润燥 · 四季皆宜</div>
  <div class="price-row">
    <span class="price"><span class="yen">¥</span>68</span>
    <span class="price-old">¥98</span>
    <span class="price-saved">省30</span>
  </div>
  <div class="tags-row">
    <span class="ttag green">🌿 茶饮方</span>
    <span class="ttag warm">明目护眼</span>
    <span class="ttag warm">清热降火</span>
  </div>
</div>

<div class="spec-card">
  <h3>选择规格</h3>
  <div class="spec-options">
    <div class="spec-opt">7日体验装 ¥68</div>
    <div class="spec-opt active">30日装 ¥168</div>
    <div class="spec-opt">60日装 ¥298</div>
  </div>
</div>

<div class="desc-card">
  <h3><span class="leaf">🌿</span> 方解 · 详情</h3>
  <div class="desc-text">
    菊花（杭白菊）为君，疏风清热、平肝明目；枸杞为臣，滋补肝肾、益精明目；佐以甘草调和诸药。每日一包，沸水冲泡，可反复续水至味淡。适合长期用眼、熬夜、上火人群。孕妇慎用。
  </div>
</div>

<div class="bottom-bar">
  <div class="cart-icon">🛒<span class="cart-badge">2</span></div>
  <button class="btn-add">加入购物车</button>
  <button class="btn-buy">立即购买</button>
</div>

</body>
</html>
