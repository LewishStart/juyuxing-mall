<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>购物车 — 林元元</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background:linear-gradient(180deg,#FDF8F3 0%,#FFFBF7 50%,#FDF8F3 100%);
  color:#4A3F35; font-size:14px; -webkit-font-smoothing:antialiased;
  max-width:430px; margin:0 auto; min-height:100vh; padding-bottom:120px;
}
.top-bar { display:flex; align-items:center; padding:12px 16px; }
.top-bar .btn { font-size:13px; color:#8B7E72; cursor:pointer; }
.top-bar h1 { font-size:18px; font-weight:700; flex:1; text-align:center; }

/* ── Cart items ── */
.cart-list { padding:0 16px; display:flex; flex-direction:column; gap:12px; }
.cart-item { background:#fff; border-radius:16px; padding:14px; display:flex; gap:12px; box-shadow:0 2px 10px rgba(74,63,53,.05); }
.item-img { width:88px; height:88px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:40px; }
.item-info { flex:1; display:flex; flex-direction:column; justify-content:space-between; }
.item-name { font-size:14px; font-weight:500; line-height:1.3; }
.item-spec { font-size:11px; color:#8B7E72; margin-top:2px; }
.item-bottom { display:flex; justify-content:space-between; align-items:center; }
.item-price { font-size:18px; font-weight:700; color:#E0725A; }
.qty { display:flex; align-items:center; border-radius:999px; border:1.5px solid #E8E0D8; overflow:hidden; }
.qty-btn { width:34px; height:32px; display:flex; align-items:center; justify-content:center; background:#FDF8F3; cursor:pointer; font-size:16px; color:#4A3F35; border:none; }
.qty-num { width:40px; text-align:center; font-size:14px; font-weight:500; background:#fff; }

/* ── Coupon bar ── */
.coupon-bar { margin:12px 16px; padding:14px 16px; background:#fff; border-radius:12px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(74,63,53,.04); cursor:pointer; }
.coupon-bar .left { display:flex; align-items:center; gap:8px; }
.coupon-icon { font-size:18px; }
.coupon-text { font-size:13px; color:#8B7E72; }
.coupon-arrow { color:#B0A59A; font-size:12px; }

/* ── Summary ── */
.summary { margin:12px 16px; padding:16px 20px; background:#fff; border-radius:16px; box-shadow:0 2px 10px rgba(74,63,53,.05); }
.s-row { display:flex; justify-content:space-between; padding:6px 0; font-size:13px; color:#8B7E72; }
.s-row.total { font-size:16px; font-weight:700; color:#4A3F35; border-top:1px solid #E8E0D8; margin-top:8px; padding-top:14px; }
.s-row.total .val { color:#E0725A; font-size:22px; }

/* ── Bottom bar ── */
.bottom-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:430px; max-width:100%; background:rgba(253,248,243,.97); backdrop-filter:blur(12px); border-top:1px solid #E8E0D8; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0)); display:flex; gap:12px; align-items:center; }
.bb-left { flex:1; }
.bb-total { font-size:24px; font-weight:800; color:#E0725A; }
.bb-info { font-size:11px; color:#8B7E72; }
.bb-btn { padding:13px 40px; border-radius:999px; background:linear-gradient(135deg,#E8A87C,#F5D6B8); color:#fff; font-size:15px; font-weight:600; cursor:pointer; border:none; box-shadow:0 4px 14px rgba(232,168,124,.25); }
</style>
</head>
<body>

<div class="top-bar">
  <div class="btn" style="visibility:hidden">编辑</div>
  <h1>购物车</h1>
  <div class="btn">编辑</div>
</div>

<div class="cart-list">
  <div class="cart-item">
    <div class="item-img" style="background:linear-gradient(135deg,rgba(245,214,184,.25),#FFFBF7)">🍵</div>
    <div class="item-info">
      <div>
        <div class="item-name">菊花枸杞清肝茶</div>
        <div class="item-spec">规格：30日装</div>
      </div>
      <div class="item-bottom">
        <span class="item-price">¥168</span>
        <div class="qty">
          <button class="qty-btn">−</button>
          <span class="qty-num">1</span>
          <button class="qty-btn">+</button>
        </div>
      </div>
    </div>
  </div>
  <div class="cart-item">
    <div class="item-img" style="background:linear-gradient(135deg,rgba(232,168,124,.12),#FDF8F3)">🌸</div>
    <div class="item-info">
      <div>
        <div class="item-name">安神助眠香薰套装</div>
        <div class="item-spec">规格：经典款</div>
      </div>
      <div class="item-bottom">
        <span class="item-price">¥128</span>
        <div class="qty">
          <button class="qty-btn">−</button>
          <span class="qty-num">2</span>
          <button class="qty-btn">+</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="coupon-bar">
  <div class="left"><span class="coupon-icon">🎫</span><span class="coupon-text">可用优惠券 2 张</span></div>
  <span class="coupon-arrow">›</span>
</div>

<div class="summary">
  <div class="s-row"><span>商品合计</span><span>¥424</span></div>
  <div class="s-row"><span>运费</span><span style="color:#6B8668">满99免运费</span></div>
  <div class="s-row total"><span>应付</span><span class="val">¥424</span></div>
</div>

<div class="bottom-bar">
  <div class="bb-left">
    <div class="bb-total">¥424</div>
    <div class="bb-info">共3件商品</div>
  </div>
  <button class="bb-btn">去结算</button>
</div>

</body>
</html>
