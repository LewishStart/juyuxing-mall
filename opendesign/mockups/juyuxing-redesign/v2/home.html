<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林元元 · 本草志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F0; --bg-pale:#F5EFE6; --bg-soft:#F0E8DC; --card:#FFFFFF; --card-2:#FDFBF8;
    --ink:#2A2622; --ink-soft:#5C544B; --ink-mute:#8B8278; --ink-faint:#C4BDB5;
    --primary:#2D4A3E; --primary-2:#5C7868; --primary-3:#1A2E25;
    --accent:#C8553D; --accent-2:#E07A5F;
    --warm:#E8A87C; --warm-soft:#F5D6B8; --leaf:#8BA888; --leaf-soft:#B5C9B0;
    --border:#E5DDD0; --divider:#EFE7D8; --divider-strong:#D4C9B8;
    --serif:"Noto Serif SC","Songti SC","STSong",serif;
    --sans:"Noto Sans SC","PingFang SC","Helvetica Neue",system-ui,sans-serif;
    --shadow-sm:0 2px 8px rgba(42,38,34,.06);
    --shadow-md:0 8px 24px rgba(42,38,34,.08);
    --shadow-lg:0 18px 40px rgba(42,38,34,.12);
    --shadow-float:0 10px 28px rgba(45,74,62,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:#E8E2D5;font-family:var(--sans);color:var(--ink);font-size:14px;}
  body{display:flex;justify-content:center;padding:24px 12px;min-height:100vh;}

  /* —— 设备外框 —— */
  .phone{width:390px;background:var(--bg);border-radius:44px;overflow:hidden;
    box-shadow:0 30px 80px rgba(42,38,34,.22);position:relative;display:flex;flex-direction:column;
    min-height:844px;}
  .phone::before{content:"";position:absolute;inset:0;border-radius:44px;border:1px solid rgba(255,255,255,.6);pointer-events:none;z-index:9;}
  .screen{flex:1;overflow-y:auto;padding-bottom:96px;scrollbar-width:none;}
  .screen::-webkit-scrollbar{display:none;}

  /* —— 状态栏 —— */
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 6px;font-size:13px;font-weight:600;color:var(--ink);}
  .statusbar .right{display:flex;gap:5px;align-items:center;}

  /* —— 通用 —— */
  .hairline{height:1px;background:var(--divider);}
  .seal{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1.5px solid var(--accent);color:var(--accent);font-family:var(--serif);font-size:11px;letter-spacing:2px;border-radius:2px;background:rgba(200,85,61,.04);}
  .seal::before{content:"";width:4px;height:4px;background:var(--accent);border-radius:50%;}

  /* —— Hero —— */
  .hero{position:relative;padding:18px 28px 32px;background:linear-gradient(180deg,var(--bg-pale) 0%,var(--bg) 70%);overflow:hidden;}
  .hero-deco{position:absolute;top:-60px;right:-80px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(139,168,136,.22),transparent 70%);pointer-events:none;}
  .hero-deco-2{position:absolute;bottom:-30px;left:-40px;width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,168,124,.16),transparent 70%);pointer-events:none;}
  .herb-svg{position:absolute;top:18px;left:24px;opacity:.45;pointer-events:none;}

  .hero-head{display:flex;justify-content:space-between;align-items:center;}
  .brand-block{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:var(--bg);font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:0;}
  .brand-text{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:3px;color:var(--ink);line-height:1;}
  .brand-text small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:6px;color:var(--ink-mute);margin-top:4px;text-transform:uppercase;font-weight:400;}
  .msg-icon{width:36px;height:36px;border-radius:50%;background:rgba(45,74,62,.08);display:flex;align-items:center;justify-content:center;position:relative;}
  .msg-icon .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1.5px solid var(--bg);}

  .hero-title{margin-top:30px;text-align:center;position:relative;z-index:2;}
  .hero-title .small{font-family:var(--sans);font-size:11px;letter-spacing:8px;color:var(--primary-2);text-transform:uppercase;font-weight:500;}
  .hero-title h1{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--ink);letter-spacing:6px;margin:8px 0 14px;line-height:1.1;}
  .hero-title h1 .accent{color:var(--accent);display:inline-block;transform:translateY(-2px);}
  .hero-divider{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--primary-2);margin:14px 0 10px;}
  .hero-divider::before,.hero-divider::after{content:"";width:36px;height:1px;background:currentColor;opacity:.6;}
  .hero-divider span{font-size:9px;letter-spacing:4px;font-family:var(--serif);}
  .hero-quote{font-family:var(--serif);font-size:13px;color:var(--ink-soft);letter-spacing:3px;line-height:1.9;}

  /* —— 搜索 —— */
  .search-row{padding:18px 24px 0;}
  .search-box{height:46px;border-radius:23px;background:rgba(255,255,255,.85);border:1px solid var(--divider);
    display:flex;align-items:center;padding:0 18px;gap:10px;box-shadow:var(--shadow-sm);backdrop-filter:blur(6px);}
  .search-box svg{flex-shrink:0;color:var(--primary-2);}
  .search-box input{flex:1;border:none;outline:none;background:transparent;font-size:13px;color:var(--ink);font-family:var(--sans);}
  .search-box input::placeholder{color:var(--ink-mute);}
  .search-tag{font-size:10px;color:var(--accent);background:rgba(200,85,61,.08);padding:3px 8px;border-radius:10px;letter-spacing:1px;}

  /* —— 分类 —— */
  .cat{padding:24px 16px 8px;}
  .cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .cat-item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .cat-orb{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 30%,#fff,var(--bg-pale));border:1px solid var(--divider);position:relative;transition:transform .2s;}
  .cat-orb::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px dashed transparent;transition:border-color .2s;}
  .cat-item:active .cat-orb{transform:scale(.92);}
  .cat-item:active .cat-orb::after{border-color:var(--primary-2);}
  .cat-label{font-family:var(--serif);font-size:12px;color:var(--ink);letter-spacing:2px;}

  /* —— 横幅 —— */
  .banner{padding:18px 24px 6px;}
  .banner-card{position:relative;height:160px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-md);isolation:isolate;}
  .banner-track{display:flex;width:200%;height:100%;animation:bannerSlide 9s ease-in-out infinite;}
  .banner-slide{width:50%;height:100%;position:relative;padding:24px;display:flex;flex-direction:column;justify-content:space-between;}
  .slide-1{background:linear-gradient(135deg,#2D4A3E 0%,#1A2E25 100%);color:#FAF6F0;}
  .slide-2{background:linear-gradient(135deg,#C8553D 0%,#A23D29 100%);color:#FAF6F0;}
  .slide-1 .badge,.slide-2 .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(250,246,240,.18);padding:4px 10px;border-radius:99px;font-size:10px;letter-spacing:2px;align-self:flex-start;}
  .slide-1 .badge svg,.slide-2 .badge svg{color:#F5D6B8;}
  .slide-title{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:2px;line-height:1.25;}
  .slide-sub{font-size:11px;opacity:.78;margin-top:6px;letter-spacing:2px;}
  .slide-cta{display:inline-flex;align-items:center;gap:6px;background:#FAF6F0;color:#2D4A3E;padding:8px 16px;border-radius:99px;font-size:11px;font-weight:600;align-self:flex-start;letter-spacing:1px;}
  .slide-illust{position:absolute;right:-10px;bottom:-10px;width:130px;height:130px;opacity:.92;}
  .banner-dots{position:absolute;bottom:14px;left:24px;display:flex;gap:5px;}
  .banner-dot{width:5px;height:5px;border-radius:99px;background:rgba(250,246,240,.4);}
  .banner-dot.active{width:18px;background:#FAF6F0;}
  @keyframes bannerSlide{0%,42%{transform:translateX(0);}50%,92%{transform:translateX(-50%);}100%{transform:translateX(0);}}

  /* —— 福利承诺 —— */
  .promise{padding:14px 24px 4px;}
  .promise-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .promise-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,.6);border:1px solid var(--divider);border-radius:14px;}
  .promise-icon{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#FAF6F0;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .promise-text{font-size:11px;color:var(--ink-soft);line-height:1.3;letter-spacing:1px;}
  .promise-text strong{display:block;color:var(--ink);font-size:12px;font-weight:500;margin-bottom:2px;font-family:var(--serif);letter-spacing:2px;}

  /* —— 区块头 —— */
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;padding:36px 28px 18px;}
  .sec-title{display:flex;flex-direction:column;gap:6px;}
  .sec-title .zh{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);letter-spacing:4px;}
  .sec-title .zh .accent{color:var(--accent);}
  .sec-title .en{font-size:10px;letter-spacing:6px;color:var(--primary-2);text-transform:uppercase;font-weight:500;}
  .sec-link{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;letter-spacing:1px;}
  .sec-link svg{color:var(--primary-2);transition:transform .2s;}
  .sec-link:active svg{transform:translateX(2px);}

  /* —— 产品网格 —— */
  .featured{padding:0 18px 8px;}
  .feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .feat-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);position:relative;transition:transform .2s;}
  .feat-card:active{transform:scale(.98);}
  .feat-img{aspect-ratio:1/1;background:linear-gradient(160deg,var(--bg-pale),var(--bg-soft));position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .feat-img svg.bottle{width:54%;height:auto;}
  .feat-img::before{content:"";position:absolute;left:50%;top:50%;width:130%;height:130%;border-radius:50%;background:radial-gradient(circle,rgba(245,214,184,.4),transparent 60%);transform:translate(-50%,-50%);}
  .feat-tag{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:4px;background:var(--primary);color:#FAF6F0;font-size:10px;padding:4px 10px;border-radius:99px;letter-spacing:2px;font-weight:500;}
  .feat-tag.hot{background:var(--accent);}
  .feat-tag.new{background:var(--leaf);}
  .feat-fav{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--ink-mute);}
  .feat-info{padding:14px 14px 16px;}
  .feat-name{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink);letter-spacing:1px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .feat-sub{font-size:11px;color:var(--ink-mute);margin-top:4px;letter-spacing:1px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .feat-meta{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
  .feat-price{display:flex;align-items:baseline;color:var(--accent);}
  .feat-price .cur{font-family:var(--serif);font-size:12px;}
  .feat-price .num{font-family:var(--serif);font-size:22px;font-weight:700;margin-left:2px;letter-spacing:.5px;}
  .feat-price .old{font-size:10px;color:var(--ink-mute);text-decoration:line-through;margin-left:6px;letter-spacing:1px;}
  .feat-add{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#FAF6F0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(45,74,62,.25);}

  /* —— 故事 —— */
  .story{padding:24px 28px 8px;position:relative;}
  .story-frame{position:relative;padding:32px 28px;background:var(--card);border:1px solid var(--divider);border-radius:6px;}
  .story-frame::before,.story-frame::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--primary);}
  .story-frame::before{top:6px;left:6px;border-right:0;border-bottom:0;}
  .story-frame::after{bottom:6px;right:6px;border-left:0;border-top:0;}
  .story-mark{font-family:var(--serif);font-size:64px;color:var(--primary);line-height:.5;height:32px;opacity:.35;margin-bottom:8px;}
  .story-zh{font-family:var(--serif);font-size:18px;color:var(--ink);letter-spacing:6px;font-weight:500;text-align:center;margin-bottom:6px;}
  .story-en{font-size:10px;letter-spacing:6px;color:var(--ink-mute);text-transform:uppercase;text-align:center;margin-bottom:18px;}
  .story-p{font-family:var(--serif);font-size:13.5px;line-height:2;color:var(--ink-soft);text-align:justify;margin-bottom:10px;letter-spacing:1px;}
  .story-p::first-letter{font-size:18px;color:var(--primary);font-weight:600;margin-right:2px;}
  .story-divider{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--primary-2);margin:18px 0;}
  .story-divider::before,.story-divider::after{content:"";width:30px;height:1px;background:currentColor;opacity:.5;}
  .story-divider span{font-family:var(--serif);font-size:10px;letter-spacing:4px;color:var(--primary);}
  .story-summary{position:relative;}
  .story-full{display:none;margin-top:14px;border-top:1px dashed var(--divider);padding-top:14px;}
  .story-full.open{display:block;animation:fadeIn .4s var(--ease-out);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .story-toggle{display:flex;align-items:center;gap:8px;margin:14px auto 0;padding:8px 18px;background:transparent;border:1px solid var(--primary);color:var(--primary);border-radius:99px;font-family:var(--serif);font-size:12px;letter-spacing:3px;cursor:pointer;transition:all .2s;}
  .story-toggle::after{content:"↓";transition:transform .3s var(--ease-out);}
  .story-toggle.open::after{transform:rotate(180deg);}
  .story-toggle:active{background:rgba(45,74,62,.06);}
  .story-author{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;padding-top:16px;border-top:1px solid var(--divider);}
  .author-seal{width:42px;height:42px;border-radius:4px;background:var(--accent);color:#FAF6F0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:11px;line-height:1.2;letter-spacing:1px;font-weight:600;box-shadow:inset 0 0 0 2px rgba(250,246,240,.18);flex-shrink:0;}
  .author-seal span{display:block;font-size:8px;letter-spacing:1px;opacity:.85;font-weight:400;}
  .author-meta{display:flex;flex-direction:column;gap:2px;}
  .author-meta .name{font-family:var(--serif);font-size:13px;color:var(--ink);letter-spacing:2px;font-weight:600;}
  .author-meta .title{font-size:10px;color:var(--ink-mute);letter-spacing:3px;}
  .story-more{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-family:var(--serif);font-size:12px;color:var(--primary);letter-spacing:4px;}
  .story-more::after{content:"→";transition:transform .2s;}
  .story-more:active::after{transform:translateX(3px);}

  /* —— 代理入口 —— */
  .agent{padding:18px 24px 12px;}
  .agent-card{position:relative;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-3) 100%);border-radius:20px;padding:24px;color:#FAF6F0;overflow:hidden;box-shadow:var(--shadow-float);}
  .agent-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(232,168,124,.35),transparent 60%);}
  .agent-eyebrow{font-size:10px;letter-spacing:6px;color:rgba(250,246,240,.65);font-family:var(--serif);text-transform:uppercase;}
  .agent-title{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:4px;margin:6px 0 8px;line-height:1.3;}
  .agent-desc{font-size:12px;line-height:1.7;opacity:.82;letter-spacing:1px;max-width:75%;}
  .agent-cta{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:9px 18px;background:#FAF6F0;color:var(--primary);border-radius:99px;font-size:12px;font-weight:600;letter-spacing:2px;font-family:var(--serif);}
  .agent-illust{position:absolute;right:16px;bottom:12px;opacity:.85;}

  /* —— Tabbar —— */
  .tabbar{position:absolute;bottom:0;left:0;right:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0));background:rgba(250,246,240,.94);backdrop-filter:blur(14px);border-top:1px solid var(--divider);display:flex;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  .tab .icon{color:var(--ink-mute);transition:color .2s;}
  .tab .label{font-size:10px;color:var(--ink-mute);letter-spacing:2px;font-family:var(--serif);transition:color .2s;}
  .tab.active .icon,.tab.active .label{color:var(--primary);}
  .tab:active .icon{transform:scale(.9);}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <!-- 状态栏 -->
    <div class="statusbar">
      <span>9:41</span>
      <span class="right">●●● 5G <svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="6" width="2.5" height="5" rx=".5" fill="currentColor"/><rect x="4" y="3.5" width="2.5" height="7.5" rx=".5" fill="currentColor"/><rect x="8" y="1.5" width="2.5" height="9.5" rx=".5" fill="currentColor"/><rect x="12" y="0" width="2.5" height="11" rx=".5" fill="currentColor"/></svg></span>
    </div>

    <!-- Hero -->
    <section class="hero">
      <div class="hero-deco"></div>
      <div class="hero-deco-2"></div>
      <svg class="herb-svg" width="60" height="60" viewBox="0 0 60 60" fill="none">
        <path d="M30 8v44" stroke="#5C7868" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M30 18c-6-2-10-6-12-12 6 0 11 4 12 12z" fill="#8BA888" opacity=".55"/>
        <path d="M30 28c6-2 10-6 12-12-6 0-11 4-12 12z" fill="#5C7868" opacity=".55"/>
        <path d="M30 40c-6-2-10-6-12-12 6 0 11 4 12 12z" fill="#8BA888" opacity=".45"/>
      </svg>

      <div class="hero-head">
        <div class="brand-block">
          <div class="brand-mark">林</div>
          <div class="brand-text">林元元<small>LIN &nbsp;YUAN&nbsp; YUAN</small></div>
        </div>
        <div class="msg-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16v11H8l-4 4z"/><path d="M8 11h8M8 14h5"/></svg>
          <span class="dot"></span>
        </div>
      </div>

      <div class="hero-title">
        <div class="small">SINCE&nbsp; 2024</div>
        <h1>本草·<span class="accent">日常</span></h1>
        <div class="hero-divider"><span>林&nbsp;元&nbsp;元</span></div>
        <div class="hero-quote">草木有灵&nbsp;&nbsp;温润人间</div>
      </div>
    </section>

    <!-- 搜索 -->
    <div class="search-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input placeholder="寻一味本草 · 菊花 / 枸杞 / 陈皮" />
        <span class="search-tag">甄选</span>
      </div>
    </div>

    <!-- 分类 -->
    <section class="cat">
      <div class="cat-grid">
        <div class="cat-item">
          <div class="cat-orb">
            <svg width="26" height="26" viewBox="0 0 32 32" fill="none"><path d="M16 4c-3 6-6 10-6 16a6 6 0 0 0 12 0c0-6-3-10-6-16z" fill="#8BA888"/><path d="M16 12v14" stroke="#2D4A3E" stroke-width="1.2" stroke-linecap="round"/></svg>
          </div>
          <span class="cat-label">草本</span>
        </div>
        <div class="cat-item">
          <div class="cat-orb">
            <svg width="26" height="26" viewBox="0 0 32 32" fill="none"><path d="M12 6h8v4l3 4v16a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V14l3-4z" fill="#E8A87C"/><rect x="9" y="18" width="14" height="6" rx="1" fill="#FDFBF8"/><rect x="11" y="3" width="10" height="4" rx="1" fill="#5C7868"/></svg>
          </div>
